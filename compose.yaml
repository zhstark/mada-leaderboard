services:
  evaluator:
    build:
      context: .
      dockerfile: Dockerfile
    image: mada-competition-evaluator:latest
    container_name: mada-competition-evaluator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
      EVALUATOR_WORK_DIR: /data/evaluator_jobs
    ports:
      - "8000:8000"
    volumes:
      - evaluator-data:/data/evaluator_jobs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  evaluator-data:
